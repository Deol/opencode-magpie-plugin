name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Validate release version
        id: release
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$/;
          if (!semver.test(pkg.version) || tag !== `v${pkg.version}`) {
            throw new Error(`Tag ${tag} must equal v${pkg.version} (SemVer without build metadata)`);
          }
          if (pkg.private || Object.keys(pkg.dependencies ?? {}).length) {
            throw new Error('The public plugin must have zero runtime dependencies');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,
            `version=${pkg.version}\ndist-tag=${pkg.version.includes('-') ? 'next' : 'latest'}\n`);
          JS

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Pack and check existing version
        id: artifact
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/magpie-release"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { tarballIntegrity, assertPublishedArtifact } from './scripts/release-metadata.mjs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tarball = join(process.env.RUNNER_TEMP, 'magpie-release', `${pkg.name}-${pkg.version}.tgz`);
          const integrity = tarballIntegrity(readFileSync(tarball));
          const response = await fetch(`https://registry.npmjs.org/${pkg.name}/${pkg.version}`);
          let published = false;
          if (response.ok) {
            assertPublishedArtifact(await response.json(), { ...pkg, integrity });
            published = true;
          } else if (response.status !== 404) {
            throw new Error(`npm registry returned ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\nintegrity=${integrity}\npublished=${published}\n`);
          JS

      - name: Publish to public npm
        if: steps.artifact.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'Missing NPM_TOKEN repository secret'; exit 1; }
          pnpm publish "$TARBALL" --no-git-checks --ignore-scripts --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org/

      - name: Verify public registry metadata
        env:
          EXPECTED_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          import { assertPublishedArtifact } from './scripts/release-metadata.mjs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const verify = async (remaining) => {
            const response = await fetch(`https://registry.npmjs.org/${pkg.name}/${pkg.version}`);
            if (!response.ok) {
              if (remaining > 0 && (response.status === 404 || response.status >= 500)) {
                await setTimeout(5000);
                return verify(remaining - 1);
              }
              throw new Error(`Public npm verification failed: HTTP ${response.status}`);
            }
            const published = await response.json();
            assertPublishedArtifact(published, { ...pkg, integrity: process.env.EXPECTED_INTEGRITY });
            console.log(`Verified ${published.name}@${published.version}: public, zero runtime dependencies`);
          };
          await verify(12);
          JS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          flags=()
          if [ "$DIST_TAG" = next ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}"
